[workspace]
resolver = "3"
members = [
    "writer",
    "reader",
    "shared_ipc"
]

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.88"

[workspace.dependencies]
shared_ipc = { path = "shared_ipc" }
aes-gcm = "0.10"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
env_logger = "0.11"
getrandom = { version = "0.2", features = ["std"] }
libc = "0.2"
log = "0.4"

[profile.release]
lto = "fat"
codegen-units = 1
