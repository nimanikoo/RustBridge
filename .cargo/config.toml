# Use the ARMv8 AES and PMULL instructions on Apple Silicon (and other aarch64 CPUs).
# Without these flags the RustCrypto `aes` 0.8 / `polyval` 0.6 crates fall back to a
# constant-time software implementation that is roughly an order of magnitude slower.
# x86_64 needs no flags: AES-NI / CLMUL are detected at runtime.
[target.'cfg(target_arch = "aarch64")']
rustflags = ["--cfg", "aes_armv8", "--cfg", "polyval_armv8"]
